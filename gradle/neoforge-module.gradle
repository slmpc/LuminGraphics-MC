apply plugin: 'java-library'
apply plugin: 'net.neoforged.moddev'

def moduleSpec = rootProject.ext.minecraftLeafSpec.call(project.path)
def commonProject = project(moduleSpec.commonPath)
evaluationDependsOn(commonProject.path)
def minecraftVersion = moduleSpec.version
def versionKey = minecraftVersion == '26.1.2' ? '2612' : '262'
def packageKey = minecraftVersion == '26.1.2' ? 'v2612' : 'v262'
def expectedNeoForgeVersion = minecraftVersion == '26.1.2' ? '26.1.2.76' : '26.2.0.37-beta'
def expectedNeoFormVersion = minecraftVersion == '26.1.2' ? '26.1.2-1' : '26.2-2'
def entrypointClass = "com.github.slmpc.lumingraphics.mc.${packageKey}.neoforge.LuminGraphicsNeoForge${versionKey}"
def mixinConfigName = minecraftVersion == '26.1.2' ?
        'lumin_graphics_mc_2612.mixins.json' : 'lumin-graphics-mc-262.mixins.json'
def accessTransformer = layout.projectDirectory.file('src/main/resources/META-INF/accesstransformer.cfg')
def luminVersion = libs.versions.lumin.get()
def packagedLibraries = [
        "com.github.slmpc.lumingraphics:lumin-graphics-core:${luminVersion}",
        "com.github.slmpc.lumingraphics:lumin-graphics-render:${luminVersion}",
        "com.github.slmpc.lumingraphics:lumin-graphics-text:${luminVersion}",
        "com.github.slmpc.lumingraphics:lumin-graphics-ui:${luminVersion}",
        'com.github.slmpc.prismrhi:prism-rhi-core:0.1.1',
        'com.github.slmpc.prismrhi:prism-rhi-backend-opengl-common:0.1.1',
        'com.github.slmpc.prismrhi:prism-rhi-backend-opengl41:0.1.1',
        'com.github.slmpc.prismrhi:prism-rhi-backend-opengl-dsa:0.1.1'
]

base {
    archivesName = moduleSpec.archiveBaseName
}

def luminGraphicsShadow = configurations.create('luminGraphicsShadow') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

dependencies {
    compileOnly commonProject
    add(luminGraphicsShadow.name, project(':bridge-contract')) { transitive = false }
    packagedLibraries.each { coordinate ->
        add(luminGraphicsShadow.name, coordinate) { transitive = false }
    }
}

neoForge {
    accessTransformers.from(accessTransformer)
    runs {
        client {
            client()
        }
    }
    mods {
        lumin_graphics_mc {
            sourceSet sourceSets.main
            sourceSet commonProject.sourceSets.main
        }
    }
}

tasks.named('jar') {
    dependsOn commonProject.tasks.named('classes')
    from(commonProject.sourceSets.main.output)
    dependsOn configurations.luminGraphicsShadow
    from { configurations.luminGraphicsShadow.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/jars/**', 'META-INF/jarjar/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jarJar') {
    enabled = false
}

def expectedAccessTargets = minecraftVersion == '26.1.2' ? [
        'com.mojang.blaze3d.opengl.GlTexture': '(ILjava/lang/String;Lcom/mojang/blaze3d/textures/TextureFormat;IIIII)V',
        'com.mojang.blaze3d.opengl.GlTextureView': '(Lcom/mojang/blaze3d/opengl/GlTexture;II)V',
        'com.mojang.blaze3d.opengl.GlBuffer': '(Ljava/util/function/Supplier;Lcom/mojang/blaze3d/opengl/DirectStateAccess;IJILjava/nio/ByteBuffer;)V'
] : [
        'com.mojang.blaze3d.opengl.GlTexture': '(ILjava/lang/String;Lcom/mojang/blaze3d/GpuFormat;IIIIILcom/mojang/blaze3d/opengl/FrameBufferCache;)V',
        'com.mojang.blaze3d.opengl.GlTextureView': '(Lcom/mojang/blaze3d/opengl/GlTexture;IILcom/mojang/blaze3d/opengl/FrameBufferCache;)V',
        'com.mojang.blaze3d.opengl.GlBuffer$Direct': '(Lcom/mojang/blaze3d/opengl/DirectStateAccess;IJIZ)V',
        'com.mojang.blaze3d.opengl.GlProgram': '(ILjava/lang/String;)V'
]

def verifyNeoForgeContract = tasks.register('verifyNeoForgeContract') {
    group = 'verification'
    description = "Validates NeoForge ${minecraftVersion} entrypoint, metadata, AT, mixin, and common-output wiring."
    dependsOn tasks.named('jar'), tasks.named('createMinecraftArtifacts'), commonProject.tasks.named('classes')
    inputs.files(sourceSets.main.allSource, accessTransformer)
    inputs.files(commonProject.sourceSets.main.output)
    doLast {
        def catalogText = rootProject.file('gradle/libs.versions.toml').getText('UTF-8')
        if (!catalogText.contains('moddev = "2.0.140"')) {
            throw new GradleException('NeoForge modules require exact ModDevGradle 2.0.140')
        }
        def commonBuildText = commonProject.file('build.gradle.kts').getText('UTF-8')
        if (!commonBuildText.contains(expectedNeoFormVersion)) {
            throw new GradleException("${commonProject.path} must use exact NeoForm ${expectedNeoFormVersion}")
        }
        def loaderBuildText = file('build.gradle.kts').getText('UTF-8')
        if (!loaderBuildText.contains(expectedNeoForgeVersion)) {
            throw new GradleException("${project.path} must use exact NeoForge ${expectedNeoForgeVersion}")
        }
        def sourcePath = entrypointClass.replace('.', '/') + '.java'
        def source = file("src/main/java/${sourcePath}")
        if (!source.isFile()) {
            throw new GradleException("Missing NeoForge ${minecraftVersion} client entrypoint: ${source}")
        }
        def sourceText = source.getText('UTF-8')
        def lifecycleContracts = minecraftVersion == '26.1.2'
                ? ['MinecraftUiRuntime2612.bindCurrent', 'runtime.close()']
                : ['RenderSystem.assertOnRenderThread()', 'GL.getCapabilities()', 'token.invalidate()']
        (["@Mod(value = LuminGraphicsNeoForge${versionKey}.MOD_ID, dist = Dist.CLIENT)"]
                + lifecycleContracts).each { contract ->
            if (!sourceText.contains(contract)) {
                throw new GradleException("NeoForge ${minecraftVersion} lifecycle contract is missing: ${contract}")
            }
        }
        ['glfwCreateWindow', 'glfwInit', 'GL.createCapabilities'].each { forbidden ->
            if (sourceText.contains(forbidden)) {
                throw new GradleException("NeoForge ${minecraftVersion} must borrow Minecraft context, found ${forbidden}")
            }
        }

        def metadata = file('src/main/resources/META-INF/neoforge.mods.toml')
        if (!metadata.isFile()) throw new GradleException("Missing NeoForge ${minecraftVersion} metadata: ${metadata}")
        def metadataText = metadata.getText('UTF-8')
        def requiredMetadata = [
                'modLoader="javafml"', 'loaderVersion="[11,)"', 'modId="lumin_graphics_mc"',
                "version=\"${project.version}+mc${minecraftVersion}\"", "config=\"${mixinConfigName}\"",
                "versionRange=\"[${expectedNeoForgeVersion}]\"", "versionRange=\"[${minecraftVersion}]\"",
                'side="CLIENT"', '[features.lumin_graphics_mc]', 'javaVersion="[25,)"'
        ]
        requiredMetadata.each { value ->
            if (!metadataText.contains(value)) {
                throw new GradleException("NeoForge ${minecraftVersion} metadata is missing exact value: ${value}")
            }
        }

        def mixinConfig = commonProject.file("src/main/resources/${mixinConfigName}")
        if (!mixinConfig.isFile()) {
            throw new GradleException("Missing matching common mixin config: ${mixinConfig}")
        }
        def mixin = new groovy.json.JsonSlurper().parse(mixinConfig)
        def registeredMixins = ((mixin.mixins ?: []) + (mixin.client ?: [])) as List
        if (registeredMixins.isEmpty()) {
            throw new GradleException("NeoForge ${minecraftVersion} mixin config registers no mixins")
        }

        def atFile = accessTransformer.asFile
        if (!atFile.isFile()) throw new GradleException("Missing NeoForge ${minecraftVersion} access transformer: ${atFile}")
        def atLines = atFile.readLines('UTF-8').collect { it.trim() }
                .findAll { !it.isEmpty() && !it.startsWith('#') }
        def actualTargets = [:]
        atLines.each { line ->
            def match = line =~ /^public(?:-f)?\s+([^\s]+)\s+<init>(\([^\s]+)$/
            if (!match.matches()) throw new GradleException("Malformed NeoForge ${minecraftVersion} AT line: ${line}")
            actualTargets[match.group(1)] = match.group(2)
        }
        if (actualTargets != expectedAccessTargets) {
            throw new GradleException("NeoForge ${minecraftVersion} AT targets do not match its generated shape: ${actualTargets}")
        }

        def patchedJar = file("build/moddev/artifacts/minecraft-patched-${expectedNeoForgeVersion}.jar")
        if (!patchedJar.isFile()) throw new GradleException("Missing matching patched Minecraft JAR: ${patchedJar}")
        def javap = new File(System.getProperty('java.home'), 'bin/javap.exe')
        expectedAccessTargets.each { className, descriptor ->
            def process = new ProcessBuilder(javap.absolutePath, '-classpath', patchedJar.absolutePath,
                    '-p', '-s', className).redirectErrorStream(true).start()
            if (!process.waitFor(30, java.util.concurrent.TimeUnit.SECONDS)) {
                process.destroyForcibly()
                throw new GradleException("Timed out validating NeoForge ${minecraftVersion} AT target ${className}")
            }
            def exitValue = process.exitValue()
            def text = process.inputStream.getText('UTF-8')
            if (exitValue != 0 || !text.contains("descriptor: ${descriptor}")) {
                throw new GradleException("NeoForge ${minecraftVersion} AT descriptor not found in ${className}: ${descriptor}")
            }
        }

        def classFile = layout.buildDirectory.file("classes/java/main/${entrypointClass.replace('.', '/')}.class").get().asFile
        if (!classFile.isFile()) throw new GradleException("Entrypoint was not compiled: ${classFile}")
        def classBytes = classFile.bytes
        def majorVersion = ((classBytes[6] & 0xff) << 8) | (classBytes[7] & 0xff)
        if (majorVersion != 69) {
            throw new GradleException("NeoForge ${minecraftVersion} entrypoint is not Java 25 bytecode: ${majorVersion}")
        }
        def outputJar = tasks.named('jar').get().archiveFile.get().asFile
        def runtimeLoader = new URLClassLoader(([outputJar] + sourceSets.main.runtimeClasspath.files)
                .collect { it.toURI().toURL() } as URL[],
                ClassLoader.getPlatformClassLoader())
        try {
            Class.forName(entrypointClass, false, runtimeLoader)
        } finally {
            runtimeLoader.close()
        }
        def commonClassSuffix = minecraftVersion == '26.1.2' ?
                'com/github/slmpc/lumingraphics/mc/v2612/bridge/Blaze3DBridge2612.class' :
                'com/github/slmpc/lumingraphics/mc/v262/bridge/Blaze3DBridge262.class'
        def commonClass = commonProject.layout.buildDirectory.file("classes/java/main/${commonClassSuffix}").get().asFile
        if (!commonClass.isFile()) throw new GradleException("Matching common output was not compiled: ${commonClass}")

        def commonNeoForgeImports = commonProject.fileTree('src/main/java') { include '**/*.java' }.files.findAll {
            it.getText('UTF-8').contains('net.neoforged')
        }
        if (!commonNeoForgeImports.isEmpty()) {
            throw new GradleException("NeoForge types leaked outside loader module: ${commonNeoForgeImports}")
        }
        def otherVersion = minecraftVersion == '26.1.2' ? 'v262' : 'v2612'
        def crossVersionSources = fileTree('src/main/java') { include '**/*.java' }.files.findAll {
            it.getText('UTF-8').contains("lumingraphics.mc.${otherVersion}")
        }
        if (!crossVersionSources.isEmpty()) {
            throw new GradleException("Cross-version accessor leakage in ${project.path}: ${crossVersionSources}")
        }

        def zip = new java.util.zip.ZipFile(outputJar)
        try {
            def entries = zip.entries().collect { it.name } as Set
            def requiredEntries = [entrypointClass.replace('.', '/') + '.class',
                    'META-INF/neoforge.mods.toml', 'META-INF/accesstransformer.cfg', mixinConfigName,
                    commonClassSuffix]
            requiredEntries.each { entry ->
                if (!entries.contains(entry)) {
                    throw new GradleException("NeoForge ${minecraftVersion} JAR is missing required entry: ${entry}")
                }
            }
            def forbiddenPrefix = "com/github/slmpc/lumingraphics/mc/${otherVersion}/"
            if (entries.any { it.startsWith(forbiddenPrefix) }) {
                throw new GradleException("NeoForge ${minecraftVersion} JAR contains cross-version classes: ${forbiddenPrefix}")
            }
        } finally {
            zip.close()
        }
        logger.lifecycle("Validated NeoForge ${minecraftVersion}: NeoForm ${expectedNeoFormVersion}, NeoForge ${expectedNeoForgeVersion}, ${registeredMixins.size()} mixins, ${actualTargets.size()} AT descriptors")
    }
}

tasks.named('check') { dependsOn verifyNeoForgeContract }

def todo22TaskNames = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
if (todo22TaskNames.any { it in ['runAllBridgeSmokes', 'runAllBridgeNegativeSmokes'] }) {
    def negative = todo22TaskNames.contains('runAllBridgeNegativeSmokes')
    def evidenceDir = System.getenv('LUMIN_MC_SMOKE_EVIDENCE_DIR') ?:
            'D:/Dev/ChenMeng/LuminGraphics/.omo/start-work/attempts/lumin-graphics-prism-rhi-migration-20260730/todo22-smokes'
    def smokeRunDir = layout.buildDirectory.dir("todo22-run-${negative ? 'negative' : 'positive'}")
    tasks.matching { it.name == 'runClient' }.configureEach {
        def smokeOutput = new File(evidenceDir, "${moduleSpec.stableId}-${negative ? 'negative' : 'positive'}.json")
        environment 'LUMIN_MC_SMOKE_MODE', negative ? moduleSpec.negativeMode : 'positive'
        environment 'LUMIN_MC_SMOKE_OUTPUT', smokeOutput.absolutePath
        doFirst {
            delete smokeOutput
            if (!negative) delete new File(smokeOutput.parentFile, smokeOutput.name.replace('.json', '.png'))
            delete smokeRunDir
            workingDir smokeRunDir.get().asFile
        }
        doLast { delete smokeRunDir }
    }
}
