plugins {
    id 'java'
    alias(libs.plugins.loom) apply false
    alias(libs.plugins.moddev) apply false
}

group = providers.gradleProperty('group').get()
version = providers.gradleProperty('version').get()

allprojects {
    group = rootProject.group
    version = rootProject.version
}

subprojects {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'isolatedLuminChain'
                    url = uri(System.getProperty('maven.repo.local', rootProject.file('.missing-m2').absolutePath))
                    metadataSources { mavenPom(); gradleMetadata(); artifact() }
                }
            }
            filter {
                includeGroup('com.github.slmpc.lumingraphics')
                includeGroup('com.github.slmpc.prismrhi')
            }
        }
    }
    plugins.withId('java') {
        java {
            toolchain { languageVersion = JavaLanguageVersion.of(25) }
            withSourcesJar()
        }
        tasks.withType(JavaCompile).configureEach {
            options.release = 25
            options.encoding = 'UTF-8'
        }
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.tomlj:tomlj:1.1.1'
    testImplementation libs.junit
    testImplementation gradleTestKit()
    testRuntimeOnly libs.junit.launcher
}

def neoform2612 = configurations.create('neoform2612') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}
def neoform262 = configurations.create('neoform262') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}
dependencies {
    add('neoform2612', 'net.neoforged:neoform:26.1.2-1@zip')
    add('neoform262', 'net.neoforged:neoform:26.2-2@zip')
}

test {
    useJUnitPlatform()
    ['baseline.26.1.2', 'baseline.26.2', 'baseline.root.26.1.2', 'baseline.root.26.2'].each { propertyName ->
        def value = System.getProperty(propertyName)
        if (value != null) {
            systemProperty propertyName, value
        }
        inputs.property propertyName, value ?: '<default>'
    }
    systemProperty 'maven.repo.local', System.getProperty('maven.repo.local', '')
}

def registerGeneratedBaseline = { String suffix, String minecraftVersion, String neoformVersion,
                                  String originSha, Configuration originConfiguration ->
    def outputDir = layout.buildDirectory.dir("generated-baselines/${minecraftVersion}")
    def loomSources = fileTree(layout.projectDirectory.dir('.gradle/loom-cache/minecraftMaven')) {
        include "**/${minecraftVersion}/*-${minecraftVersion}-sources.jar"
    }
    def moddevSources = layout.projectDirectory.file(
            "mc-${minecraftVersion}-common/build/moddev/artifacts/vanilla-${neoformVersion}-sources.jar")
    def generateTask = tasks.register("generate${suffix}Baseline", JavaExec) {
        group = 'minecraft matrix'
        description = "Materializes independently generated Loom and ModDev sources for Minecraft ${minecraftVersion}."
        dependsOn classes, ":mc-${minecraftVersion}-fabric:genSources",
                ":mc-${minecraftVersion}-common:createMinecraftArtifacts"
        inputs.files loomSources, moddevSources, originConfiguration
        outputs.dir outputDir
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.github.slmpc.lumingraphics.mc.baseline.GeneratedBaselineTool'
        doFirst {
            def matches = loomSources.files.findAll { it.isFile() }
            if (matches.size() != 1) {
                throw new GradleException("Expected one Loom ${minecraftVersion} sources JAR, found ${matches.size()}: ${matches}")
            }
            delete outputDir
            setArgs(['generate', minecraftVersion, libs.versions.loom.get(), libs.versions.moddev.get(),
                    "net.neoforged:neoform:${neoformVersion}@zip",
                    "https://maven.neoforged.net/releases/net/neoforged/neoform/${neoformVersion}/neoform-${neoformVersion}.zip",
                    originConfiguration.singleFile, originSha, matches.first(), moddevSources.asFile, outputDir.get().asFile])
        }
    }
    def verifyTask = tasks.register("verify${suffix}Baseline", JavaExec) {
        group = 'verification'
        dependsOn classes, generateTask
        inputs.dir outputDir
        inputs.dir layout.projectDirectory.dir("reference/vanilla-${minecraftVersion}")
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.github.slmpc.lumingraphics.mc.baseline.GeneratedBaselineTool'
        args 'verify', outputDir.get().asFile, file("reference/vanilla-${minecraftVersion}")
    }
    [generateTask, verifyTask]
}

def baseline2612 = registerGeneratedBaseline('2612', '26.1.2', '26.1.2-1',
        '3eb9f8cc282badfbc210a27a8304f14cc58fa40401a94072874dfaded3c8cb52', neoform2612)
def baseline262 = registerGeneratedBaseline('262', '26.2', '26.2-2',
        '09fd01e2371a94c78bc4d0d28645ab88206fcef395795182cee841765ebd5a63', neoform262)

tasks.register('downloadMinecraftSources') {
    group = 'minecraft matrix'
    description = 'Runs Loom and ModDev source production for both supported Minecraft baselines.'
    dependsOn baseline2612[0], baseline262[0]
}

tasks.register('verifyMinecraftSources') {
    group = 'verification'
    description = 'Parses and verifies selected Mojang source baselines and their SHA-256 manifests.'
    dependsOn test, 'verifyWrapperChecksum', baseline2612[1], baseline262[1]
}

tasks.register('verifyWrapperChecksum') {
    inputs.files 'gradle/wrapper/gradle-wrapper.jar', 'gradle/wrapper/gradle-wrapper.jar.sha256'
    doLast {
        def expected = file('gradle/wrapper/gradle-wrapper.jar.sha256').text.trim()
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def actual = digest.digest(file('gradle/wrapper/gradle-wrapper.jar').bytes).encodeHex().toString()
        if (actual != expected) {
            throw new GradleException("Gradle wrapper JAR checksum mismatch: expected ${expected}, got ${actual}")
        }
    }
}

def loaderVariants = [
        ':mc-26.1.2-fabric', ':mc-26.1.2-neoforge',
        ':mc-26.2-fabric', ':mc-26.2-neoforge'
]

tasks.register('verifyVariantJars', JavaExec) {
    group = 'verification'
    description = 'Recursively verifies the four self-contained loader artifacts and their isolated provenance.'
    dependsOn classes
    loaderVariants.each { variant -> dependsOn "${variant}:jar" }
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.slmpc.lumingraphics.mc.packaging.VariantJarVerifier'
    doFirst {
        def arguments = [layout.projectDirectory.asFile, System.getProperty('maven.repo.local', '')]
        def overrideDirectory = providers.gradleProperty('variantJarOverride').orNull
        if (overrideDirectory != null) arguments.add(file(overrideDirectory))
        setArgs(arguments)
    }
}

tasks.register('buildAllVariants') {
    group = 'build'
    description = 'Builds and verifies all six modules and four final dependency-mod artifacts.'
    dependsOn ':mc-26.1.2-common:check', ':mc-26.1.2-fabric:check', ':mc-26.1.2-neoforge:check'
    dependsOn ':mc-26.2-common:check', ':mc-26.2-fabric:check', ':mc-26.2-neoforge:check'
    loaderVariants.each { variant ->
        dependsOn "${variant}:clean", "${variant}:build"
        project(variant).tasks.configureEach { task ->
            if (task.name != 'clean') task.mustRunAfter project(variant).tasks.named('clean')
        }
    }
    dependsOn 'verifyVariantJars'
}

def bridgeSmokeVariants = [
        ':mc-26.1.2-fabric', ':mc-26.1.2-neoforge',
        ':mc-26.2-fabric', ':mc-26.2-neoforge'
]
def bridgeSmokeEvidence = file(System.getenv('LUMIN_MC_SMOKE_EVIDENCE_DIR') ?:
        'D:/Dev/ChenMeng/LuminGraphics/.omo/start-work/attempts/lumin-graphics-prism-rhi-migration-20260730/todo22-smokes')

def validateBridgeSmokeArtifacts = { boolean negative ->
    def suffix = negative ? 'negative' : 'positive'
    bridgeSmokeVariants.each { path ->
        def name = path.substring(1)
        def jsonFile = new File(bridgeSmokeEvidence, "${name}-${suffix}.json")
        if (!jsonFile.isFile() || jsonFile.length() == 0) {
            throw new GradleException("Missing terminal bridge smoke artifact: ${jsonFile}")
        }
        def receipt = new groovy.json.JsonSlurper().parse(jsonFile)
        if (receipt.pass != true || receipt.cleanup != true || receipt.mode != (negative ? receipt.mode : 'positive')) {
            throw new GradleException("Bridge smoke did not pass: ${jsonFile}: ${receipt}")
        }
        if (negative) {
            if (receipt.expectedFailure != receipt.observedFailure || receipt.beforeDraw != true || receipt.beforeDeletion != true) {
                throw new GradleException("Negative smoke did not fail before native work: ${jsonFile}")
            }
            return
        }
        if (receipt.objects?.size() != 3 || receipt.objects.any { object ->
            object.directions?.size() != 2 || object.directions.any { it.mode != 'BORROWED_ZERO_COPY' || !(it.nativeId instanceof Number) } ||
                    object.preCloseGlIs != true || object.borrowedCloseGlIs != true || object.ownerCloseGlIs != false
        }) throw new GradleException("Incomplete zero-copy object matrix: ${jsonFile}")
        ['sampler', 'pipeline', 'encoder', 'renderPass', 'borrowedCloseLive', 'ownerCloseDeleted'].each { field ->
            if (receipt[field] != true) throw new GradleException("Missing ${field} proof: ${jsonFile}")
        }
        def pngFile = new File(jsonFile.parentFile, jsonFile.name.replace('.json', '.png'))
        def image = javax.imageio.ImageIO.read(pngFile)
        if (image == null || image.width != 8 || image.height != 8) throw new GradleException("Invalid PNG: ${pngFile}")
        def colors = new HashSet<Integer>()
        for (int y = 0; y < image.height; y++) for (int x = 0; x < image.width; x++) colors.add(image.getRGB(x, y))
        if (colors.size() < 4) throw new GradleException("PNG is blank or lacks deterministic colors: ${pngFile}")
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(pngFile.bytes).encodeHex().toString()
        if (receipt.pixelHash != digest) throw new GradleException("PNG hash mismatch: ${pngFile}")
    }
}

def registerBridgeSmokeMatrix = { String taskName, boolean negative ->
    tasks.register(taskName) {
        group = 'verification'
        description = "Runs all four real Minecraft bridge ${negative ? 'negative ' : ''}smokes sequentially."
        bridgeSmokeVariants.each { dependsOn "${it}:runClient" }
        doLast { validateBridgeSmokeArtifacts(negative) }
    }
}

registerBridgeSmokeMatrix('runAllBridgeSmokes', false)
registerBridgeSmokeMatrix('runAllBridgeNegativeSmokes', true)

if (gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['runAllBridgeSmokes', 'runAllBridgeNegativeSmokes'] }) {
    gradle.projectsEvaluated {
        def prior = null
        bridgeSmokeVariants.each { path ->
            def current = project(path).tasks.named('runClient')
            if (prior != null) current.configure { mustRunAfter prior }
            prior = current
        }
    }
}

def architectureModules = [
        ':bridge-contract', ':mc-26.1.2-common', ':mc-26.1.2-fabric', ':mc-26.1.2-neoforge',
        ':mc-26.2-common', ':mc-26.2-fabric', ':mc-26.2-neoforge'
]

def architectureMatrixCheck = project(':bridge-contract').tasks.register('architectureMatrixCheck', Test) {
    group = 'verification'
    dependsOn project(':bridge-contract').tasks.named('testClasses')
    testClassesDirs = project(':bridge-contract').sourceSets.test.output.classesDirs
    classpath = project(':bridge-contract').sourceSets.test.runtimeClasspath
    include '**/BridgeMatrixTest.class'
    useJUnitPlatform()
    testLogging.showStandardStreams = true
}

tasks.register('architectureCheck', Test) {
    group = 'verification'
    description = 'Checks reflection, loader, version, GAV, service, window, JAR, and bridge-matrix boundaries.'
    dependsOn testClasses, architectureMatrixCheck
    architectureModules.each { module ->
        dependsOn "${module}:classes"
        if (module.contains('fabric') || module.contains('neoforge')) dependsOn "${module}:jar"
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/ArchitectureGuardTest.class'
    useJUnitPlatform()
    testLogging.showStandardStreams = true
    systemProperty 'lumin.mc.root', rootProject.projectDir.absolutePath
    doLast {
        int dependencyCount = 0
        architectureModules.each { path ->
            def module = project(path)
            ['api', 'implementation', 'compileOnly', 'runtimeOnly'].each { name ->
                def configuration = module.configurations.findByName(name)
                if (configuration == null) return
                configuration.dependencies.each { dependency ->
                    dependencyCount++
                    if (dependency.version == '0.0.1') {
                        throw new GradleException("stale 0.0.1 GAV in ${path}:${name}: ${dependency.group}:${dependency.name}:${dependency.version}")
                    }
                    if (dependency.group in ['com.github.slmpc.lumingraphics', 'com.github.slmpc.prismrhi']
                            && dependency.version != null && dependency.version != '0.1.0') {
                        throw new GradleException("stale published GAV in ${path}:${name}: ${dependency.group}:${dependency.name}:${dependency.version}")
                    }
                }
            }
        }
        if (dependencyCount == 0) throw new GradleException('architecture dependency graph inspection was empty')
        println "ARCH_MC_DEPENDENCIES count=${dependencyCount} modules=${architectureModules.size()}"
    }
}
