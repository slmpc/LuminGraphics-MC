apply plugin: 'java-library'
apply plugin: 'net.fabricmc.fabric-loom'

import groovy.json.JsonSlurper

def moduleSpec = rootProject.ext.minecraftLeafSpec.call(project.path)
def commonProject = project(moduleSpec.commonPath)
dependencies {
    implementation commonProject
    implementation 'com.github.slmpc.prismrhi:prism-rhi-backend-opengl41:0.1.0'
    implementation 'com.github.slmpc.prismrhi:prism-rhi-backend-opengl-dsa:0.1.0'
}

def minecraftVersion = moduleSpec.version
def versionKey = minecraftVersion.replace('.', '')
def expectedLoader = minecraftVersion == '26.1.2' ? '0.19.2' : '0.19.3'
def expectedApi = minecraftVersion == '26.1.2' ? '0.150.0+26.1.2' : '0.156.0+26.2'
def mixinName = minecraftVersion == '26.1.2' ?
        'lumin_graphics_mc_2612.mixins.json' : 'lumin-graphics-mc-262.mixins.json'
def accessWidenerName = "lumin_graphics_mc_${versionKey}.accesswidener"
def packagedLibraries = [
        'com.github.slmpc.lumingraphics:lumin-graphics-core:1.0.0',
        'com.github.slmpc.lumingraphics:lumin-graphics-render:1.0.0',
        'com.github.slmpc.lumingraphics:lumin-graphics-text:1.0.0',
        'com.github.slmpc.lumingraphics:lumin-graphics-ui:1.0.0',
        'com.github.slmpc.prismrhi:prism-rhi-core:0.1.0',
        'com.github.slmpc.prismrhi:prism-rhi-backend-opengl-common:0.1.0',
        'com.github.slmpc.prismrhi:prism-rhi-backend-opengl41:0.1.0',
        'com.github.slmpc.prismrhi:prism-rhi-backend-opengl-dsa:0.1.0'
]

base {
    archivesName = moduleSpec.archiveBaseName
}

def luminGraphicsShadow = configurations.create('luminGraphicsShadow') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

dependencies {
    packagedLibraries.each { coordinate ->
        add(luminGraphicsShadow.name, coordinate) { transitive = false }
    }
}

sourceSets {
    main {
        java.srcDir commonProject.file('src/main/java')
        resources.srcDir commonProject.file('src/main/resources')
    }
}

loom {
    accessWidenerPath = file("src/main/resources/${accessWidenerName}")
}

tasks.named('compileJava') {
    mustRunAfter tasks.named('genSourcesWithVineflower')
}

tasks.named('jar') {
    dependsOn configurations.luminGraphicsShadow
    from { configurations.luminGraphicsShadow.collect { zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/jars/**', 'META-INF/jarjar/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('verifyFabricWiring') {
    group = 'verification'
    description = "Validates Fabric metadata and version isolation for Minecraft ${minecraftVersion}."
    def resources = layout.projectDirectory.dir('src/main/resources')
    def entrypoint = layout.projectDirectory.file(
            "src/main/java/com/github/slmpc/lumingraphics/mc/fabric/v${versionKey}/LuminGraphicsFabricClient.java")
    inputs.files(fileTree('src') { include '**/*' })
    doLast {
        def metadataFile = resources.file('fabric.mod.json').asFile
        def awFile = resources.file(accessWidenerName).asFile
        if (!metadataFile.isFile()) throw new GradleException("Missing Fabric metadata for ${minecraftVersion}")
        if (!awFile.isFile()) throw new GradleException("Missing version-specific Access Widener for ${minecraftVersion}")
        if (!entrypoint.asFile.isFile()) throw new GradleException("Missing Fabric client entrypoint for ${minecraftVersion}")

        def metadata = new JsonSlurper().parse(metadataFile)
        def expectedEntrypoint = "com.github.slmpc.lumingraphics.mc.fabric.v${versionKey}.LuminGraphicsFabricClient"
        if (metadata.id != 'lumin_graphics_mc') throw new GradleException("Unexpected Fabric mod id: ${metadata.id}")
        if (metadata.version != "1.0.0+mc${minecraftVersion}") {
            throw new GradleException("Unexpected Fabric version: ${metadata.version}")
        }
        if (metadata.environment != 'client' || metadata.entrypoints?.client != [expectedEntrypoint]) {
            throw new GradleException("Fabric client entrypoint mismatch for ${minecraftVersion}")
        }
        if (metadata.accessWidener != awFile.name || metadata.mixins != [mixinName]) {
            throw new GradleException("Fabric AW/mixin registration mismatch for ${minecraftVersion}")
        }
        def expectedDependencies = [
                fabricloader: "=${expectedLoader}",
                minecraft: "=${minecraftVersion}",
                java: '>=25',
                'fabric-api': "=${expectedApi}"
        ]
        if (metadata.depends != expectedDependencies) {
            throw new GradleException("Fabric dependency constraints mismatch: ${metadata.depends}")
        }
        def buildText = project.file('build.gradle.kts').getText('UTF-8')
        if (!buildText.contains("fabric-loader:${expectedLoader}") ||
                !buildText.contains("fabric-api:${expectedApi}")) {
            throw new GradleException("Fabric dependency pins mismatch for ${minecraftVersion}")
        }
        def awText = awFile.getText('UTF-8')
        if (!awText.startsWith('accessWidener v2 official')) {
            throw new GradleException("Access Widener namespace/header mismatch for ${minecraftVersion}")
        }
        if (awText.contains(minecraftVersion == '26.1.2' ? 'FrameBufferCache' : 'TextureFormat')) {
            throw new GradleException("Swapped Fabric Access Widener detected for ${minecraftVersion}")
        }
        def commonMixin = commonProject.file("src/main/resources/${mixinName}")
        if (!commonMixin.isFile()) throw new GradleException("Missing matching common mixin output: ${mixinName}")
    }
}

def verifyFabricArtifact = tasks.register('verifyFabricArtifact') {
    group = 'verification'
    description = "Inspects and class-loads the Fabric artifact for Minecraft ${minecraftVersion}."
    dependsOn tasks.named('jar')
    inputs.files(tasks.named('jar').flatMap { it.archiveFile })
    inputs.files(configurations.runtimeClasspath)
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def entrypointName = "com.github.slmpc.lumingraphics.mc.fabric.v${versionKey}.LuminGraphicsFabricClient"
        def entrypointPath = entrypointName.replace('.', '/') + '.class'
        def commonMarker = minecraftVersion == '26.1.2' ?
                'com/github/slmpc/lumingraphics/mc/v2612/bridge/Blaze3DBridge2612.class' :
                'com/github/slmpc/lumingraphics/mc/v262/bridge/Blaze3DBridge262.class'
        def oppositeMarker = minecraftVersion == '26.1.2' ? '/v262/' : '/v2612/'
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            [entrypointPath, 'fabric.mod.json', accessWidenerName.toString(), mixinName, commonMarker].each { required ->
                if (!names.contains(required)) throw new GradleException("Fabric artifact misses ${required}")
            }
            if (names.any { it.contains(oppositeMarker) }) {
                throw new GradleException("Fabric artifact contains opposite-version classes: ${oppositeMarker}")
            }
            def metadata = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            if (metadata.entrypoints.client != [entrypointName]) {
                throw new GradleException("Packaged Fabric entrypoint mismatch for ${minecraftVersion}")
            }
            zip.getInputStream(zip.getEntry(entrypointPath)).withCloseable { input ->
                def bytes = new DataInputStream(input)
                if (Integer.toUnsignedLong(bytes.readInt()) != 0xCAFEBABEL || bytes.readUnsignedShort() != 0 ||
                        bytes.readUnsignedShort() != 69) {
                    throw new GradleException("Fabric entrypoint is not Java 25 bytecode")
                }
            }
        }
        def urls = ([jarFile] + configurations.runtimeClasspath.files).collect { it.toURI().toURL() } as URL[]
        new URLClassLoader(urls, ClassLoader.platformClassLoader).withCloseable { loader ->
            def entrypointClass = Class.forName(entrypointName, false, loader)
            def initializerClass = Class.forName('net.fabricmc.api.ClientModInitializer', false, loader)
            if (!initializerClass.isAssignableFrom(entrypointClass)) {
                throw new GradleException("Packaged entrypoint does not implement Fabric ClientModInitializer")
            }
        }
        [rootProject.file('bridge-contract/src/main'), commonProject.file('src/main')].each { sourceRoot ->
            def leaked = fileTree(sourceRoot) { include '**/*.java' }.files.find { source ->
                source.getText('UTF-8').contains('net.fabricmc')
            }
            if (leaked != null) throw new GradleException("Fabric type leaked outside Fabric modules: ${leaked}")
        }
    }
}

tasks.named('check') { dependsOn 'verifyFabricWiring', verifyFabricArtifact }

def todo22TaskNames = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
if (todo22TaskNames.any { it in ['runAllBridgeSmokes', 'runAllBridgeNegativeSmokes'] }) {
    def negative = todo22TaskNames.contains('runAllBridgeNegativeSmokes')
    def evidenceDir = System.getenv('LUMIN_MC_SMOKE_EVIDENCE_DIR') ?:
            'D:/Dev/ChenMeng/LuminGraphics/.omo/start-work/attempts/lumin-graphics-prism-rhi-migration-20260730/todo22-smokes'
    def smokeRunDir = layout.buildDirectory.dir("todo22-run-${negative ? 'negative' : 'positive'}")
    tasks.named('runClient').configure {
        def smokeOutput = new File(evidenceDir, "${moduleSpec.stableId}-${negative ? 'negative' : 'positive'}.json")
        environment 'LUMIN_MC_SMOKE_MODE', negative ? moduleSpec.negativeMode : 'positive'
        environment 'LUMIN_MC_SMOKE_OUTPUT', smokeOutput.absolutePath
        doFirst {
            delete smokeOutput
            if (!negative) delete new File(smokeOutput.parentFile, smokeOutput.name.replace('.json', '.png'))
            delete smokeRunDir
            workingDir smokeRunDir.get().asFile
        }
        doLast { delete smokeRunDir }
    }
}
