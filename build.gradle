        maven { url = uri(localRepository) }
    }
    mavenCentral()
    maven { url = uri('https://slmpc.github.io/maven-repository/') }
}

allprojects {
    group = rootProject.group
    version = rootProject.version
    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

subprojects {
    repositories {
        def localRepository = providers.gradleProperty('localRepository')
                .orElse(providers.gradleProperty('publishRepository')).orNull
        if (localRepository != null) {
            maven { url = uri(localRepository) }
        }
        mavenCentral()
        maven { url = uri('https://slmpc.github.io/maven-repository/') }
    }
    plugins.withId('java') {
