def minecraftLeafSpecs = gradle.ext.minecraftLeafSpecs
def minecraftLeafSpec = { String projectPath ->
    def spec = minecraftLeafSpecs[projectPath]
    if (spec == null) {
        throw new GradleException("Unknown Minecraft leaf project path '${projectPath}'. Expected one of: ${minecraftLeafSpecs.keySet().join(', ')}")
    }
    spec
}
rootProject.ext.minecraftLeafSpecs = minecraftLeafSpecs
rootProject.ext.minecraftLeafSpec = minecraftLeafSpec

def registerGeneratedBaseline = { String suffix, String minecraftVersion, String neoformVersion,
                                  String originSha, Configuration originConfiguration ->
    def commonSpec = minecraftLeafSpec(":mc-${minecraftVersion}:common")
    def fabricSpec = minecraftLeafSpec(":mc-${minecraftVersion}:fabric")
    def outputDir = layout.buildDirectory.dir("generated-baselines/${minecraftVersion}")
    def loomSources = providers.provider {
        project(fabricSpec.projectPath).tasks.named('genSourcesWithVineflower').get().sourcesOutputJar.get().asFile
    }
    def moddevSources = layout.projectDirectory.file(
            "${commonSpec.physicalDir}/build/moddev/artifacts/vanilla-${neoformVersion}-sources.jar")
    def generateTask = tasks.register("generate${suffix}Baseline", JavaExec) {
        group = 'minecraft matrix'
        description = "Materializes independently generated Loom and ModDev sources for Minecraft ${minecraftVersion}."
        dependsOn classes, "${fabricSpec.projectPath}:genSources",
                "${commonSpec.projectPath}:createMinecraftArtifacts"
        inputs.file loomSources
        inputs.files moddevSources, originConfiguration
        outputs.dir outputDir
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.github.slmpc.lumingraphics.mc.baseline.GeneratedBaselineTool'
        doFirst {
            def loomSource = loomSources.get()
            delete outputDir
            setArgs(['generate', minecraftVersion, libs.versions.loom.get(), libs.versions.moddev.get(),
                    "net.neoforged:neoform:${neoformVersion}@zip",
                    "https://maven.neoforged.net/releases/net/neoforged/neoform/${neoformVersion}/neoform-${neoformVersion}.zip",
                    originConfiguration.singleFile, originSha, loomSource, moddevSources.asFile, outputDir.get().asFile])
        }
    }
    def verifyTask = tasks.register("verify${suffix}Baseline", JavaExec) {
        group = 'verification'
        dependsOn classes, generateTask
        inputs.dir outputDir
        inputs.dir layout.projectDirectory.dir("reference/vanilla-${minecraftVersion}")
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'com.github.slmpc.lumingraphics.mc.baseline.GeneratedBaselineTool'
        args 'verify', outputDir.get().asFile, file("reference/vanilla-${minecraftVersion}")
    }
    [generateTask, verifyTask]
}

